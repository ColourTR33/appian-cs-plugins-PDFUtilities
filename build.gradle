plugins {
  id 'java'
  id 'groovy'
  id 'com.diffplug.spotless' version '6.25.0'
  id 'com.github.spotbugs' version '6.0.26'
  id 'org.owasp.dependencycheck' version '8.0.2'
  id 'pmd'
  id "checkstyle"
  id "jacoco"
}

repositories {
  mavenCentral()

  flatDir {
    dirs 'libs'
  }
}

dependencies {
  //  compileOnly name: 'appian-plug-in-sdk-24.2-stub'
  compileOnly name: 'appian-plug-in-sdk-25.2'
  compileOnly 'com.appian:connected-systems-core:1.2.0'
  compileOnly 'javax.servlet:javax.servlet-api:3.1.0'
  compileOnly 'javax.annotation:javax.annotation-api:1.2'
  compileOnly 'javax.persistence:javax.persistence-api:2.2'
  compileOnly 'commons-io:commons-io:2.14.0'
  compileOnly 'org.apache.commons:commons-lang3:3.18.0'
  compileOnly 'org.apache.commons:commons-collections4:4.4'
  compileOnly 'org.apache.logging.log4j:log4j-1.2-api:2.17.1'
  compileOnly 'com.google.guava:guava:32.0.1-android'

  // add your runtime dependencies here
  // implementation 'groupId:artifactId:version'
  // https://mvnrepository.com/artifact/org.jsoup/jsoup
  implementation("org.jsoup:jsoup:1.21.2")
  // https://mvnrepository.com/artifact/com.openhtmltopdf/openhtmltopdf-pdfbox
  implementation("com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10")


  testImplementation platform("org.junit:junit-bom:5.10.3")
  testImplementation "org.junit.jupiter:junit-jupiter"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"

  testImplementation "org.mockito:mockito-core:5.12.0"
  testImplementation "org.mockito:mockito-junit-jupiter:5.12.0"

  // add Mockito’s bytecode deps explicitly
  testImplementation "net.bytebuddy:byte-buddy:1.14.19"
  testImplementation "net.bytebuddy:byte-buddy-agent:1.14.19"
  testImplementation "org.objenesis:objenesis:3.3"

  spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.12.0'
}

// Configure Jacoco to exclude Appian's stub classes from analysis
jacocoTestReport {
  afterEvaluate {
    classDirectories.setFrom(files(classDirectories.files.collect {
      fileTree(dir: it, exclude: [
        'com/appiancorp/**',
        'com/appian/**',
        'javax/**'
      ])
    }))
  }
}

checkstyle {
  configFile = rootProject.file("config/checkstyle.xml")
  ignoreFailures = false
  maxWarnings = 0
  toolVersion '8.25'
}

spotless {
  encoding 'UTF-8'

  groovyGradle {
    target '**/*.gradle'
    greclipse().configFile('.settings/greclipse.properties')
  }

  java {
    target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
    eclipse().configFile('.settings/org.eclipse.jdt.core.prefs')
    importOrder('java', 'org', 'com')
    removeUnusedImports()
  }

  format 'xml', {
    target 'src/**/*.xml'
    eclipseWtp('xml').configFile('.settings/org.eclipse.wst.xml.core.prefs')
  }

  format 'misc', {
    target '*.md'
    trimTrailingWhitespace()
    indentWithSpaces(2)
    endWithNewline()
  }
}

spotbugs {
  ignoreFailures = true
  showProgress = true
}

spotbugsMain {
  reports {
    html {
      enabled = true
      stylesheet = 'fancy-hist.xsl'
    }

    xml {
      enabled = false
    }
  }
}

jacocoTestCoverageVerification {
  violationRules {
    rule {
      limit {
        minimum = 0.25
      }
    }
  }
}

configurations {
  testImplementation.extendsFrom compileOnly
}

pmd {
  consoleOutput = true
  ignoreFailures = true
  ruleSets = [
    "category/java/errorprone.xml",
    "category/java/bestpractices.xml"
  ]
}

// In build.gradle, REPLACE your existing test block with this one.

test {
  useJUnitPlatform()
  jvmArgs += [
    "-Djdk.attach.allowAttachSelf=true",
    "--add-opens",
    "java.base/java.lang=ALL-UNNAMED",
    "--add-opens",
    "java.base/java.lang.invoke=ALL-UNNAMED",
    "--add-opens",
    "java.base/java.util=ALL-UNNAMED"
  ]
  finalizedBy jacocoTestReport // Use the default, configured report task.

  // Get the Jacoco extension and configure the agent's properties directly.
  // This is the standard, robust way to apply exclusions.
  def jacoco = extensions.getByType(org.gradle.testing.jacoco.plugins.JacocoTaskExtension)

  // The agent uses dot-notation for class name patterns.
  jacoco.setExcludes([
    'com.appiancorp.**',
    'com.appian.**',
    'javax.**'
  ])
}

jar {
  dependsOn check
  duplicatesStrategy = DuplicatesStrategy.FAIL

  configurations.implementation.setCanBeResolved(true)

  into('META-INF/lib') {
    from(configurations.implementation)
  }

  into('src') {
    from (sourceSets.main.allJava)
  }

  manifest {
    attributes("Spring-Context": "*;publish-context:=false")
  }
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(17)
  }
}

version = new groovy.xml.XmlSlurper().parse(file('src/main/resources/appian-plugin.xml')).'plugin-info'.version